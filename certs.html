<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat - Elcida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #16213e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-back {
            display: inline-block;
            background-color: #0f3460;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #e94560;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .btn-back:hover {
            background-color: #1a1a2e;
        }
        .cert-card {
            background-color: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #e94560;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tombol Kembali -->
        <a href="index.html" class="btn-back">⬅ Kembali ke Beranda</a>

        <h1>Sertifikat & Penghargaan</h1>

        <div class="cert-card">
            <h3>Sertifikat #1</h3>
            <p>Deskripsi pencapaian atau sertifikasi.</p>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('elcida_user')) {
            alert('Silahkan login terlebih dahulu!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
