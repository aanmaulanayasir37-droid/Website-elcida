<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerita - Elcida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #16213e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-back {
            display: inline-block;
            background-color: #0f3460;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #e94560;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .btn-back:hover {
            background-color: #1a1a2e;
        }
        .story-box {
            background-color: #0f3460;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tombol Kembali -->
        <a href="index.html" class="btn-back">⬅ Kembali ke Beranda</a>

        <h1>Cerita Elcida</h1>
        
        <div class="story-box">
            <h2>Kisah Perjalanan</h2>
            <p>Tuliskan cerita atau sejarah tentang Elcida di bagian ini...</p>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('elcida_user')) {
            alert('Silahkan login terlebih dahulu!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
