<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Elcida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-discord:hover {
            background-color: #4752C4;
        }
        .user-info {
            margin-top: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Website Elcida</h1>
        <p>Silahkan login menggunakan akun Discord kamu.</p>

        <!-- Tombol Login -->
        <button id="login-btn" class="btn-discord" onclick="loginDiscord()">Login dengan Discord</button>

        <!-- Tempat Tampilan Profil Setelah Login -->
        <div id="user-profile" class="user-info" style="display: none;">
            <img id="user-avatar" class="avatar" src="" alt="Avatar">
            <h2 id="user-name"></h2>
            <p id="user-id"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // PENTING: GANTI DENGAN CLIENT ID MILIKMU!
        // ==========================================
        const DISCORD_CLIENT_ID = "1547833891098730571"; // <-- Masukkan Client ID Discord kamu di sini

        // Redirect URI otomatis mengambil URL GitHub Pages kamu saat ini
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        function loginDiscord() {
            const oauthUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = oauthUrl;
        }

        // Fungsi membaca Token setelah Redirect dari Discord
        function handleOAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                // Ambil data profil dari Discord API
                fetch('https://discord.com/api/users/@me', {
                    headers: {
                        authorization: `Bearer ${accessToken}`
                    }
                })
                .then(res => res.json())
                .then(response => {
                    const { username, discriminator, avatar, id } = response;
                    
                    // Sembunyikan tombol login
                    document.getElementById('login-btn').style.display = 'none';

                    // Tampilkan data profil
                    document.getElementById('user-profile').style.display = 'block';
                    document.getElementById('user-name').innerText = `${username}#${discriminator}`;
                    document.getElementById('user-id').innerText = `ID: ${id}`;
                    
                    if (avatar) {
                        document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${id}/${avatar}.png`;
                    } else {
                        document.getElementById('user-avatar').src = `https://cdn.discordapp.com/embed/avatars/0.png`;
                    }

                    // Bersihkan Hash token dari URL agar rapi
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch(console.error);
            }
        }

        // Jalankan pengecekan token saat halaman dimuat
        window.onload = handleOAuth;
    </script>
</body>
</html>
